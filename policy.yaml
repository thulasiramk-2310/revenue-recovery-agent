# ---------------------------------------------------------------------------
# Payment Recovery Policy
#
# This file is the ONLY place recovery behaviour is decided. src/policy.py is a
# pure interpreter of this document: it must not contain hardcoded failure
# codes, delays, or thresholds. Every decision the agent emits cites the rule
# path here that produced it (the `policy_rule_applied` field in the audit
# log), so a reviewer can diff this file against the trail and reproduce any
# single call the agent made.
#
# Money is always in paise. Times are IST (Asia/Kolkata) unless named _utc.
# ---------------------------------------------------------------------------

version: 1
policy_id: recovery-policy-v1

# --- Global bounds -------------------------------------------------------
# Hard ceilings. No code path may exceed these, whatever a per-code rule says.
limits:
  # TWO SEPARATE BUDGETS. Exhausting one must never silently spend or
  # cancel the other. Gateway attempts cost money and issuer goodwill;
  # customer contacts cost attention and trust. A customer whose card has
  # expired needs a message precisely BECAUSE retrying is pointless, so
  # running out of attempts is not a reason to stop talking to them.
  max_attempts: 4                 # GATEWAY attempts per txn, INCLUDING the
                                  # original failure that got us here. Bounds
                                  # rungs marked `consumes: attempt` only.
  cooldown_hours: 6               # DEFAULT min gap between two attempts on one
                                  # txn. A retry_window may shorten this for
                                  # itself via cooldown_override_minutes, but
                                  # only with a stated reason -- see
                                  # NETWORK_TIMEOUT. Nothing may loosen
                                  # max_attempts, which stays absolute.
  max_attempts_per_customer_per_day: 5
  max_customer_contacts_per_transaction: 2
                                  # CONTACT budget. Bounds rungs marked
                                  # `consumes: contact` only, and is checked
                                  # independently of max_attempts.
  max_contacts_per_customer_per_24h: 2
                                  # PER CUSTOMER, across all their failed
                                  # transactions. The per-transaction quota
                                  # alone is not a limit on what a PERSON
                                  # receives: a customer with five failed
                                  # payments would collect ten messages while
                                  # every transaction stayed individually
                                  # compliant. Harassment is measured per
                                  # person, so the ceiling has to be too.
                                  #
                                  # A ROLLING 24h window, not a calendar day.
                                  # Measured as a calendar day this cap let 20
                                  # message pairs through by straddling
                                  # midnight, and one customer received three
                                  # messages inside 24 hours while every
                                  # individual day stayed under the limit. A
                                  # ceiling with a documented way around it is
                                  # not a ceiling.
  min_hours_between_contacts: 24  # Two dunning messages in the same minute is
                                  # harassment even when both are permitted by
                                  # quota. Spacing is a compliance property of
                                  # the contact budget, not of the retry
                                  # cooldown, which protects the instrument.
  batch_spend_ceiling_paise: 250000
                                  # Rs 2,500. A runaway-spend breaker, not a
                                  # budget. It must sit well ABOVE normal
                                  # operation or it stops being a safety
                                  # device and becomes a silent cap.
                                  #
                                  # At Rs 1,000 it was the latter: the seed-44
                                  # batch spends Rs 943.50 and squeaked under,
                                  # but seeds 42, 99 and 2026 all aborted
                                  # mid-run at ~Rs 998, truncating the batch
                                  # and changing every headline number. A
                                  # breaker that fires on three of four normal
                                  # runs is not catching anything.
                                  #
                                  # Raising it is free: seed 44 never reaches
                                  # either ceiling, so the reference run is
                                  # bit-identical at Rs 1,000 and Rs 2,500.
                                  # Set to 0/null to disable in experiments;
                                  # lower it deliberately to prove the abort.
  abort_batch_if_decline_rate_above: 0.85
                                  # circuit breaker: if live retries are
                                  # declining above this rate, halt the batch.
                                  # We are probably making things worse, e.g.
                                  # an issuer outage we failed to detect.

# --- Terminal failures ---------------------------------------------------
# Never RETRIED. Hard declines: a retry is pure cost, irritates the issuer,
# and on some networks counts against the merchant's decline ratio.
#
# This list forecloses the gateway, not the customer. "The only legitimate
# move is asking the customer for new instrument details" is a description of
# what the agent SHOULD still do here, so a code in this list disables rungs
# marked `consumes: attempt` and then continues down the ladder to the contact
# rungs. Treating a hard decline as the end of the transaction was a bug: it
# abandoned exactly the customers most able to fix the problem themselves.
stop_immediately_on:
  - ACCOUNT_CLOSED
  - CARD_BLOCKED
  - CARD_EXPIRED
  - INVALID_CVV

# --- Retry windows, keyed by failure code --------------------------------
# delays_minutes = offset from the ORIGINAL failure for each later attempt.
# Its length caps retries for that code; limits.max_attempts still wins if
# it is lower.
#
# strategy:
#   immediate_backoff - transient fault, retry fast with widening spacing
#   scheduled         - retry at a time chosen for balance-availability reasons
#   await_signal      - blocked until an external condition clears, then retry
#   none              - never retry (terminal)
retry_windows:

  NETWORK_TIMEOUT:
    strategy: immediate_backoff
    delays_minutes: [2, 15, 90]
    require_reconcile_before_retry: true
    cooldown_override_minutes: 2
    cooldown_override_rationale: >
      The 6h default exists to stop us hammering a customer's instrument with
      repeated dunning attempts. This is not that: the authorisation outcome
      is genuinely unknown, and the correct move is to reconcile and settle
      the ambiguity quickly. Waiting 6h to find out whether we already
      charged someone is worse for the customer, not better. Guarded by
      require_reconcile_before_retry, so no blind re-attempt happens here.
    rationale: >
      A timeout is ambiguous: the authorisation may have actually succeeded at
      the issuer. Reconcile payment status before every retry or we risk
      double-charging the customer.

  ISSUER_DOWN:
    strategy: await_signal
    resume_when: issuer_health_recovered
    max_wait_hours: 12
    delays_minutes: [30]          # applied AFTER the health signal clears
    require_reconcile_before_retry: true
    cooldown_override_minutes: 30
    cooldown_override_rationale: >
      The gap here is set by the issuer's recovery, not by a fixed clock: the
      transaction is held for the whole outage window and only then waits 30
      minutes. Leaving the 6h default on top would add delay on the far side
      of a wait that is already long, for no protective benefit.
    rationale: >
      Retrying into a degraded issuer burns attempts against max_attempts for
      a reason that has nothing to do with this customer. Hold, then spend a
      single attempt once the bank recovers.

  INSUFFICIENT_FUNDS:
    strategy: scheduled
    delays_minutes: [1440, 4320]  # +1 day, +3 days
    align_to: salary_credit_window
    rationale: >
      Balance-driven, not instrument-driven. Indian retail balances reload on
      salary credit, typically the 1st-7th. Retrying an hour later mostly
      re-hits an empty account; aligning to the reload window is where the
      recoverable money actually is.

  DO_NOT_HONOR:
    strategy: scheduled
    delays_minutes: [720, 2880]   # +12h, +2 days
    max_attempts_override: 3
    rationale: >
      Generic issuer refusal hiding several causes. Soft velocity and risk
      blocks do clear; many others never will. Retry sparingly, escalate early.

  CARD_EXPIRED:
    strategy: none
    rationale: Terminal. Needs a new instrument from the customer.
  CARD_BLOCKED:
    strategy: none
    rationale: Terminal. Issuer-side block; customer must contact their bank.
  ACCOUNT_CLOSED:
    strategy: none
    rationale: Terminal. The account no longer exists.
  INVALID_CVV:
    strategy: none
    rationale: Terminal for stored credentials. Needs re-entry by the customer.

  UNKNOWN:
    strategy: scheduled
    delays_minutes: [360]         # >= limits.cooldown_hours, deliberately
    max_attempts_override: 2
    rationale: >
      Unmapped code. One conservative retry, then human review. The delay is
      set at the default cooldown rather than given an override: for a
      failure we do not understand, the cautious default should win. Loosening
      a limit requires a specific reason, and "we don't know what this is" is
      the opposite of one.

# Which retry_windows entry catches a failure code we have never seen. Named
# here rather than in code so that policy.py needs no literal failure code of
# its own -- see the architectural rule at the top of this file.
unmapped_code_fallback: UNKNOWN

# --- LLM diagnosis of unmapped codes -------------------------------------
# A model may PROPOSE a diagnosis for a failure code the taxonomy does not
# know. It may never choose an action, set a delay, or touch a limit. Those
# stay here, and policy.py stays the only thing that decides.
#
# The containment is structural rather than a matter of prompt discipline:
#   - the model may only return a code that ALREADY exists in the taxonomy,
#     so it cannot invent a severity or a retry allowance
#   - only codes MISSING from the taxonomy are ever sent, so a proposal can
#     never override or soften a code the project already understands
#   - every failure -- unmapped proposal, malformed output, HTTP error,
#     timeout, missing key -- routes to unmapped_code_fallback above
#
# That last one is the important one. An LLM timeout must never become
# permission. The fallback it lands on is UNKNOWN, whose single retry at
# +360 min was argued for on its own merits long before any model was
# planned: "we don't know what this is" is the opposite of a reason to relax
# a limit.
llm_diagnosis:
  enabled: true
  provider: groq
  model: openai/gpt-oss-120b
  prompt_version: diag-v1       # bump on ANY prompt edit. The audit trail
                                # records this so a reviewer can tell a model
                                # change from a prompt change later -- they
                                # have completely different fixes.
  min_confidence: 0.70          # below this the proposal is discarded and the
                                # code stays UNKNOWN. A guess that clears the
                                # bar by pretending to be certain is the one
                                # failure this cannot detect, which is why the
                                # prompt tells the model to answer UNSURE.
  timeout_seconds: 8
  max_output_tokens: 300
  rationale: >
    Worth doing because the taxonomy is eight hand-written codes and a real
    merchant stream is not. Worth bounding this tightly because a wrong
    confident mapping can authorise retries against an account that will
    never settle, which is exactly the harm the stopping rules exist to
    prevent.

# --- Salary-credit alignment ---------------------------------------------
# Used by retry_windows[*].align_to. A scheduled retry is nudged into the next
# such window when one falls within lookahead_hours.
salary_credit_window:
  days_of_month: [1, 2, 3, 4, 5, 6, 7]
  preferred_hour_ist: 11
  lookahead_hours: 96

# --- Escalation ladder ---------------------------------------------------
# Ordered. The agent climbs one rung at a time and never skips. A rung whose
# `requires` predicates are unmet is passed over, not jumped.
#
# `consumes` names which budget the rung spends, and is the ONLY thing that
# decides which limit bounds it:
#   attempt - limits.max_attempts, limits.cooldown_hours
#   contact - limits.max_customer_contacts_per_transaction,
#             limits.min_hours_between_contacts, compliance.contact_hours_ist
#   none    - spends neither, so it stays reachable after both are exhausted
#
# Running out of one budget disables only the rungs that spend it. The ladder
# then keeps descending. This is why a hard decline, which can never spend an
# attempt, still reaches step 3.
escalation_ladder:

  - step: 1
    action: silent_retry
    description: Re-attempt authorisation. No customer contact.
    requires: [retry_permitted, retryable_failure, attempts_remaining, cooldown_elapsed]
    consumes: attempt
    repeatable: true                # each firing is a distinct retry, bounded
                                    # by attempts_remaining
    customer_visible: false

  - step: 2
    action: retry_with_updated_instrument
    description: >
      Re-attempt using a newer saved instrument for the same customer, where
      the network account-updater has supplied one.
    requires: [retry_permitted, alternate_instrument_available, attempts_remaining]
    consumes: attempt
    repeatable: true
    customer_visible: false

  - step: 3
    action: notify_customer
    description: One transactional message stating the payment failed, with a fix link.
    requires:
      [contact_quota_remaining, customer_contact_quota_remaining,
       contact_spacing_elapsed, within_contact_hours, consent_on_file]
    consumes: contact
    repeatable: false               # sending this template twice is a
                                    # duplicate, not an escalation. Without
                                    # this, step 3 spends the whole contact
                                    # budget on two identical notices and
                                    # step 4 -- the message that actually asks
                                    # for a new instrument -- never sends.
    customer_visible: true
    channel_preference: [email, sms]

  - step: 4
    action: request_instrument_update
    description: Secure link to replace the expired or blocked instrument.
    requires:
      [contact_quota_remaining, customer_contact_quota_remaining,
       contact_spacing_elapsed, within_contact_hours, consent_on_file]
    consumes: contact
    repeatable: false
    customer_visible: true

  - step: 5
    action: hand_off_to_human
    description: Queue for merchant ops review. The agent takes no further action.
    requires: []
    consumes: none
    customer_visible: false
    terminal: true

# --- Compliance rails ----------------------------------------------------
# Not optimisations. A run that violates one of these is a FAILED run even if
# it recovered more money.
compliance:
  contact_hours_ist:
    start: "09:00"
    end: "21:00"
  quiet_days: []                  # national holidays, if supplied
  require_consent_for_contact: true
  transactional_only: true        # never mix marketing into a recovery message
  subscription_rules:             # RBI e-mandate norms for recurring debits
    require_pre_debit_notification: true
    pre_debit_notification_hours: 24
    max_retries_per_mandate_cycle: 2
    rationale: >
      Recurring debits carry a pre-debit notification duty and tighter retry
      norms than one-off card payments, so subscriptions are capped separately
      and more strictly than limits.max_attempts.
  never_do:
    - store_raw_card_details
    - retry_after_customer_opt_out
    - contact_outside_contact_hours
    - exceed_max_attempts

# --- Audit ---------------------------------------------------------------
audit:
  log_path: results/run.log
  hash_chain: true                # each entry commits to the previous one
  log_skipped_decisions: true     # "we chose NOT to retry" is a decision too
                                  # and must appear in the trail
