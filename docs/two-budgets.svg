<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" role="img" aria-label="The escalation ladder splits into two independent budgets: gateway attempts and customer contacts. Exhausting one does not exhaust the other.">
  <title>Two budgets, drained independently</title>
  <desc>Rungs 1 and 2 spend gateway attempts. Rungs 3 and 4 spend customer contacts. Rung 5 spends neither and stays reachable. Running out of attempts leaves the contact path open, which is why a hard decline still reaches the customer.</desc>

  <style>
    .bg   { fill: #0d1117; }
    .box  { fill: #161b22; stroke: #30363d; stroke-width: 1.5; rx: 8; }
    .att  { fill: #0c2340; stroke: #60a5fa; stroke-width: 2; }
    .con  { fill: #0e2f26; stroke: #34d399; stroke-width: 2; }
    .non  { fill: #2b2b12; stroke: #d4a017; stroke-width: 2; }
    .t    { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #e6edf3; }
    .lbl  { font-size: 13px; font-weight: 600; }
    .sub  { font-size: 10px; fill: #8b949e; }
    .edge { stroke: #484f58; stroke-width: 2; fill: none; marker-end: url(#b); }
    .eA   { stroke: #60a5fa; stroke-width: 2.5; fill: none; marker-end: url(#bA); }
    .eC   { stroke: #34d399; stroke-width: 2.5; fill: none; marker-end: url(#bC); }
    .eN   { stroke: #d4a017; stroke-width: 2.5; fill: none; marker-end: url(#bN); }

    .flow { stroke-dasharray: 7 11; animation: march 1.5s linear infinite; }
    @keyframes march { to { stroke-dashoffset: -18; } }

    /* the two meters drain on different clocks -- that is the whole point */
    .drainA { animation: drainA 5s ease-in-out infinite; }
    @keyframes drainA {
      0%,  8%  { width: 176px; fill: #60a5fa; }
      45%,100% { width: 0px;   fill: #60a5fa; }
    }
    .drainC { animation: drainC 5s ease-in-out infinite; }
    @keyframes drainC {
      0%, 48% { width: 176px; fill: #34d399; }
      92%,100%{ width: 0px;   fill: #34d399; }
    }
    .showA { animation: showA 5s ease-in-out infinite; }
    @keyframes showA { 0%,40% { opacity: .25; } 50%,100% { opacity: 1; } }

    @media (prefers-reduced-motion: reduce) {
      .flow, .drainA, .drainC, .showA { animation: none; }
      .drainA, .drainC { width: 88px; }
      .showA { opacity: 1; }
    }
  </style>

  <defs>
    <marker id="b"  viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#484f58"/></marker>
    <marker id="bA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#60a5fa"/></marker>
    <marker id="bC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker>
    <marker id="bN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d4a017"/></marker>
  </defs>

  <rect class="bg" width="860" height="300"/>
  <text class="t sub" x="24" y="26" font-size="11">Exhausting one budget disables only the rungs that spend it. The ladder keeps descending.</text>

  <!-- ladder -->
  <rect class="box" x="24" y="118" width="150" height="60"/>
  <text class="t lbl" x="99" y="142" text-anchor="middle">escalation</text>
  <text class="t lbl" x="99" y="158" text-anchor="middle">ladder</text>
  <text class="t sub" x="99" y="172" text-anchor="middle">each rung declares</text>

  <path class="eA flow" d="M174,138 L246,72"/>
  <path class="eC flow" d="M174,152 L246,166"/>
  <path class="eN flow" d="M174,166 L246,250"/>

  <!-- attempts -->
  <rect class="box att" x="250" y="42" width="230" height="62"/>
  <text class="t lbl" x="266" y="64" fill="#93c5fd">consumes: attempt</text>
  <text class="t sub" x="266" y="80">rungs 1-2 · gateway retry</text>
  <text class="t sub" x="266" y="94">max_attempts 4 · cooldown 6h</text>

  <rect x="502" y="58" width="180" height="16" rx="4" fill="#161b22" stroke="#30363d"/>
  <rect class="drainA" x="504" y="60" width="14" height="12" rx="3" fill="#60a5fa"/>
  <text class="t sub" x="694" y="71" fill="#60a5fa">attempts: SPENT</text>

  <!-- contacts -->
  <rect class="box con" x="250" y="136" width="230" height="62"/>
  <text class="t lbl" x="266" y="158" fill="#6ee7b7">consumes: contact</text>
  <text class="t sub" x="266" y="174">rungs 3-4 · customer message</text>
  <text class="t sub" x="266" y="188">quota 2 · 24h spacing · 09-21 IST</text>

  <rect x="502" y="152" width="180" height="16" rx="4" fill="#161b22" stroke="#30363d"/>
  <rect class="drainC" x="504" y="154" width="176" height="12" rx="3" fill="#34d399"/>
  <text class="t sub" x="694" y="165" fill="#34d399">contacts: STILL AVAILABLE</text>

  <!-- the moment that matters -->
  <g class="showA" opacity="1">
    <rect x="502" y="86" width="330" height="40" rx="6" fill="#1a1207" stroke="#d4a017" stroke-width="1.5"/>
    <text class="t sub" x="516" y="102" fill="#fcd34d" font-weight="600">attempts exhausted — contacts still available</text>
    <text class="t sub" x="516" y="117">a hard decline stops retrying and starts talking</text>
  </g>

  <!-- handoff -->
  <rect class="box non" x="250" y="228" width="230" height="46"/>
  <text class="t lbl" x="266" y="248" fill="#fcd34d">consumes: none</text>
  <text class="t sub" x="266" y="264">rung 5 · hand off — always reachable</text>
</svg>
